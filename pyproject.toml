[project]
name = "oneplus2-llm-bot"
version = "0.1.0"
description = "Bot de Telegram ligero con LLM local (llama.cpp) optimizado para OnePlus 2 en Termux"
requires-python = ">=3.10"
dependencies = [
    "python-telegram-bot>=21.0,<23.0",
    "httpx>=0.27.0,<1.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
